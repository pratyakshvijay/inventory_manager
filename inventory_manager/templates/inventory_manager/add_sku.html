{% extends 'inventory_manager/base.html' %}
{% block content %}
{% load widget_tweaks %}

<h2 class="mb-4">Add SKU</h2>

<form method="post" action="{% url 'add_sku' %}" class="row g-3 col-md-6">
  {% csrf_token %}
  
  <div class="col-12">
    <label for="id_sku_code" class="form-label fw-semibold">SKU Code</label>
    {{ form.sku_code|add_class:"form-control" }}
  </div>

  <div class="col-12">
    <label for="id_product_name" class="form-label fw-semibold">Product Name</label>
    {{ form.product_name|add_class:"form-control" }}
  </div>

  <div class="col-12">
    <label for="id_stock_quantity" class="form-label fw-semibold">Stock Quantity</label>
    {{ form.stock_quantity|add_class:"form-control" }}
  </div>

  <div class="col-12 mt-3">
    <button type="submit" class="btn btn-primary">
      <i class="fa-solid fa-plus me-1"></i> Add SKU
    </button>
  </div>
</form>
{% endblock %}
