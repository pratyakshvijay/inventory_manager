{% extends 'inventory_manager/base.html' %}
{% block content %}
<h2>Upload Alternate SKUs</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" action="{% url 'upload_channel_listing' %}" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}
  <input type="file" name="file" accept=".xls,.xlsx" required class="form-control mb-3">
  <button type="submit" class="btn btn-success">
    <i class="fa-solid fa-upload me-1"></i> Upload Listings
  </button>
</form>

<p class="text-muted mt-3">Required columns: <strong>Seller SKU Id</strong>, <strong>Flipkart Serial Number</strong></p>
{% endblock %}
