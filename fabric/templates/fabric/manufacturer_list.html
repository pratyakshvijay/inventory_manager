{% extends "fabric/base.html" %}

{% block content %}
<div class="container mt-4">
  <h3>Manufacturers</h3>
  <a href="{% url 'manufacturer_add' %}" class="btn btn-primary mb-3">Add Manufacturer</a>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for m in manufacturers %}
      <tr>
        <td>{{ m.name }}</td>
        <td>{{ m.phone }}</td>
        <td>{{ m.address }}</td>
        <td>
            <a href="{% url 'manufacturer_edit' m.pk %}" class="btn btn-sm btn-warning">
                <i class="fas fa-edit"></i>
            </a>
            <a href="{% url 'manufacturer_delete' m.pk %}" 
                class="btn btn-sm btn-danger"
                onclick="return confirm('Are you sure you want to delete this manufacturer?');">
                <i class="fas fa-trash"></i>
            </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
