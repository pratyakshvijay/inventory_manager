<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Fabric Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 60px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-industry"></i> Production</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'vendor_list' %}active{% endif %}" href="{% url 'vendor_list' %}"><i class="fas fa-users"></i> Vendors</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'fabric_lot_list' %}active{% endif %}" href="{% url 'fabric_lot_list' %}"><i class="fas fa-boxes"></i> Fabric Lots</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'job_work_issue_list' %}active{% endif %}" href="{% url 'job_work_issue_list' %}"><i class="fas fa-truck-loading"></i> Job Work Issue</a></li>
                <li class="nav-item"><a class="nav-link {% if '/inventory/' in request.path %}active{% endif %}" href="/inventory/"><i class="fas fa-warehouse"></i> Go to Inventory</a></li>
            </ul>
        </div>
    </div>
</nav>

{% if messages %}
  <div class="container mt-2">
    {% for message in messages %}
      <div class="alert {% if 'error' in message.tags %} alert-danger {% elif 'success' in message.tags %} alert-success {% else %} alert-info {% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

<!-- Page Content -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
